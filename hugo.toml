baseURL = 'https://anhducchu.github.io/'
languageCode = 'en-us'
title = 'Chu Anh Duc'
theme = 'barks'
disablePathToLower = true
disableKinds = ['taxonomy', 'term']
enableRobotsTXT = true

[markup.goldmark.renderer]
    unsafe = true

[menu]
    [[menu.main]]
        name = "Home"
        url = "/"
        weight = 1
    [[menu.main]]
        name = "Publications"
        url = "/publications/"
        weight = 2
    [[menu.main]]
        name = "Background"
        url = "/cv/"
        weight = 3
    [[menu.main]]
        name = "CV"
        url = "/pdf/CV_ChuAnhDuc.pdf"
        weight = 4

[params]
    author = "Chu Anh Duc"
    description = "BSc student in Data Science and AI at HUST, undergraduate researcher at AI4LIFE Lab."
    mainSections = ["posts"]

    [params.head]
        author = "Chu Anh Duc"
        description = "Chu Anh Duc (Chu Anh Đức) is a BSc student in Data Science and Artificial Intelligence at Hanoi University of Science and Technology and an undergraduate researcher at AI4LIFE Lab, working on diffusion models, optimal transport and cross-modal learning."
        keywords = ["Chu Anh Duc", "Chu Anh Đức", "Anh Duc Chu", "anhducchu", "diffusion models", "optimal transport", "knowledge distillation", "cross-modal learning", "medical imaging", "HUST", "AI4LIFE Lab"]
        # Đứng sau tên ở thẻ <title> trang chủ — Google hay hiện nguyên dòng này.
        tagline = "Data Science & AI Researcher, HUST"

    # ---- SEO ----
    [params.seo]
        # Ảnh hiện khi dán link lên Facebook, LinkedIn, Zalo, Messenger...
        og_image = "/images/og-card.png"
        locale = "en_US"
        # Các biến thể tên để Google gom về cùng một người.
        alternate_names = ["Chu Anh Đức", "Anh Duc Chu", "Anh-Duc Chu", "Duc Chu", "Đức Chu Anh"]
        job_title = "Undergraduate Researcher"
        affiliation = "Hanoi University of Science and Technology"
        affiliation_url = "https://hust.edu.vn"
        knows_about = ["Machine Learning", "Diffusion Models", "Optimal Transport", "Knowledge Distillation", "Medical Image Computing", "Cross-Modal Representation Learning"]
        # Hồ sơ ở nơi khác — tín hiệu quan trọng nhất để Google biết
        # trang này với các tài khoản kia là cùng một người.
        same_as = [
            "https://github.com/anhducchu",
            "https://www.linkedin.com/in/chuanhduc/",
        ]

    [params.header]
        # Phần tên được tô đậm (đen); phần còn lại xám nhạt.
        highlight = "Anh Duc"

    [params.navigation]
        show_navigation = true

    [params.footer]
        show_footer = true
        text = "&copy; 2026 Chu Anh Duc"

    [params.typography]
        title_font = "Bree Serif"
        body_font = "Source Sans Pro"

    # ---- Bảng màu đen trắng ----
    [params.colors]
        theme_color           = "#111111"
        background_color      = "#ffffff"
        text_color            = "#181818"
        link_color            = "#000000"
        name_blur_color       = "#c4c4c4"
        dark_background_color = "#000000"
        dark_text_color       = "#ededed"
        dark_link_color       = "#ffffff"
        dark_name_blur_color  = "#4a4a4a"

    [params.social]
        [params.social.email]
            name = "E-Mail"
            class = "fas fa-envelope"
            url = "mailto:ducca.work@gmail.com"
            weight = 1
        [params.social.github]
            name = "GitHub"
            class = "fab fa-github"
            url = "https://github.com/anhducchu"
            weight = 2
        [params.social.linkedin]
            name = "LinkedIn"
            class = "fab fa-linkedin"
            url = "https://www.linkedin.com/in/chuanhduc/"
            weight = 3
