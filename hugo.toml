baseURL = 'https://anhducchu.github.io/'
languageCode = 'en-us'
title = 'Chu Anh Duc'
theme = 'barks'
disablePathToLower = true
disableKinds = ['taxonomy', 'term']
enableRobotsTXT = true
# Lấy ngày sửa từ lịch sử git -> sitemap có <lastmod> thật cho từng trang.
# Cần fetch-depth: 0 trong .github/workflows/hugo.yml, clone nông sẽ không có dữ liệu.
enableGitInfo = true

[frontmatter]
    lastmod = [":git", "lastmod", "date"]

[markup.goldmark.renderer]
    unsafe = true

[menu]
    [[menu.main]]
        name = "Home"
        url = "/"
        weight = 1
    [[menu.main]]
        name = "Publications"
        url = "/publications/"
        weight = 2
    [[menu.main]]
        name = "About"
        url = "/about/"
        weight = 3
    [[menu.main]]
        name = "CV"
        url = "/pdf/CV_ChuAnhDuc.pdf"
        weight = 4

[params]
    author = "Chu Anh Duc"
    description = "BSc student in Data Science and AI at HUST, undergraduate researcher at AI4LIFE Lab."
    mainSections = ["posts"]

    [params.head]
        author = "Chu Anh Duc"
        description = "Chu Anh Duc (Chu Anh Đức) is a BSc student in Data Science and Artificial Intelligence at Hanoi University of Science and Technology and an undergraduate researcher at AI4LIFE Lab, working on physics-aware diffusion models, optimal transport for cross-modal distillation, and the theory of long-tailed generation."
        keywords = ["Chu Anh Duc", "Chu Anh Đức", "Anh Duc Chu", "anhducchu", "diffusion models", "optimal transport", "knowledge distillation", "cross-modal learning", "medical imaging", "HUST", "AI4LIFE Lab"]
        # Đứng sau tên ở thẻ <title> trang chủ — Google hay hiện nguyên dòng này.
        tagline = "Data Science & AI Researcher, HUST"
        # Xác minh Google Search Console. Đừng xoá sau khi verify xong,
        # Google kiểm tra lại định kỳ, mất là rớt quyền sở hữu.
        google_site_verification = "mhRFH9k5HJyCJ5G6rpoM0gh5sz4azcUnoAJNXMrgYzE"

    # ---- SEO ----
    [params.seo]
        # Ảnh hiện khi dán link lên Facebook, LinkedIn, Zalo, Messenger...
        og_image = "/images/og-card.jpg"
        locale = "en_US"
        # Các biến thể tên để Google gom về cùng một người.
        alternate_names = ["Chu Anh Đức", "Anh Duc Chu", "Anh-Duc Chu", "Duc Chu", "Đức Chu Anh"]
        job_title = "Undergraduate Researcher"
        affiliation = "Hanoi University of Science and Technology"
        affiliation_url = "https://hust.edu.vn"
        knows_about = ["Machine Learning", "Diffusion Models", "Optimal Transport", "Knowledge Distillation", "Medical Image Computing", "Cross-Modal Representation Learning", "Long-Tailed Generation"]
        # Hồ sơ ở nơi khác — tín hiệu quan trọng nhất để Google biết
        # trang này với các tài khoản kia là cùng một người.
        same_as = [
            "https://scholar.google.com/citations?user=AMkdDKQAAAAJ",
            "https://github.com/anhducchu",
            "https://www.linkedin.com/in/chuanhduc/",
        ]

    [params.header]
        # Phần tên được tô đậm (đen); phần còn lại xám nhạt.
        highlight = "Anh Duc"

    [params.navigation]
        show_navigation = true

    [params.footer]
        show_footer = true
        text = "&copy; 2026 Chu Anh Duc"

    [params.typography]
        title_font = "Bree Serif"
        body_font = "Source Sans Pro"

    # ---- Bảng màu ----
    # MẶC ĐỊNH LÀ NỀN TỐI. Tên biến vẫn giữ light/dark theo theme gốc:
    # nhóm không có tiền tố "dark_" là chế độ SÁNG (tông cyan), người dùng
    # phải bấm công tắc mới thấy. Nhóm "dark_" là navy đậm, hiện mặc định.
    #
    # Tương phản đo ở điểm dừng xấu nhất của gradient:
    #   tối : chữ 12.4:1, link 8.8:1
    #   sáng: chữ 12.5:1, link 5.8:1
    # Đổi màu thì đo lại, ngưỡng WCAG AA là 4.5:1.
    [params.colors]
        theme_color           = "#0e1a2b"
        background_color      = "#eef6f8"
        background_gradient   = "linear-gradient(135deg, #dbeef2 0%, #f4fafb 46%, #d5e9ef 100%)"
        text_color            = "#14262b"
        link_color            = "#095f6e"
        name_blur_color       = "#a9c3ca"
        dark_background_color = "#0e1a2b"
        dark_background_gradient = "linear-gradient(140deg, #142338 0%, #0e1a2b 48%, #0a1422 100%)"
        dark_text_color       = "#dde4ee"
        dark_link_color       = "#5fd0e8"
        dark_name_blur_color  = "#44536e"

    [params.social]
        [params.social.email]
            name = "E-Mail"
            class = "fas fa-envelope"
            url = "mailto:ducca.work@gmail.com"
            weight = 1
        [params.social.google_scholar]
            name = "Google Scholar"
            class = "ai ai-google-scholar-square"
            url = "https://scholar.google.com/citations?user=AMkdDKQAAAAJ"
            weight = 2
        [params.social.github]
            name = "GitHub"
            class = "fab fa-github"
            url = "https://github.com/anhducchu"
            weight = 3
        [params.social.linkedin]
            name = "LinkedIn"
            class = "fab fa-linkedin"
            url = "https://www.linkedin.com/in/chuanhduc/"
            weight = 4
